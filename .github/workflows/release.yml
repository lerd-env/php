name: Build and publish PHP binaries

# Binaries are release assets, never repo contents. A tag publishes one set for
# every supported PHP version and architecture.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      php:
        description: 'Single PHP version to build (blank builds all)'
        required: false
      arm_only:
        description: 'Build Apple silicon only (skip Intel)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # A dispatch can name one version, which is how to exercise the workflow
  # without spending ten jobs on it.
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - id: pick
        run: |
          if [ -n "${{ inputs.php }}" ]; then
            echo "versions=[\"${{ inputs.php }}\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["8.1","8.2","8.3","8.4","8.5"]' >> "$GITHUB_OUTPUT"
          fi
          # Both architectures. macos-13 was retired on 2025-12-08; its
          # replacement macos-15-intel is the last x86_64 image and goes in
          # August 2027, at which point Intel builds need another home.
          arm='{"arch":"arm64","runner":"macos-14"}'
          intel='{"arch":"x86_64","runner":"macos-15-intel"}'
          if [ "${{ inputs.arm_only }}" = "true" ]; then
            echo "targets=[$arm]" >> "$GITHUB_OUTPUT"
          else
            echo "targets=[$arm,$intel]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.plan.outputs.versions) }}
        # One dimension carrying both arch and runner. An include: entry whose
        # keys match no existing combination is added as a job of its own, so
        # pairing them there breaks the moment an arch leaves the list.
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch static-php-cli
        # Newest stable release, resolved at build time. The version and digest
        # are recorded in BUILD-INFO.txt and ship inside the release tarball.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-spc.sh .

      # The libraries are most of the build and do not change between PHP
      # versions, so caching them turns fourteen minutes into about three.
      - name: Cache the library tree
        uses: actions/cache@v4
        with:
          path: |
            buildroot
            downloads
          key: spc-${{ matrix.runner }}-${{ hashFiles('extensions.txt', 'shared-extensions.txt') }}

      # The query-capture collector lives in the lerd repository, beside the
      # image build that compiles it in. Checked out rather than vendored so
      # the two runtimes always ship the same collector.
      - name: Check out the devtools collector
        uses: actions/checkout@v4
        with:
          repository: lerd-env/lerd
          path: .lerd
          sparse-checkout: internal/podman/devtools

      - name: Build
        env:
          LERD_DEVTOOLS_SRC: ${{ github.workspace }}/.lerd/internal/podman/devtools
          # spc resolves library versions through the GitHub API, which allows
          # sixty unauthenticated requests an hour. A runner exhausts that
          # immediately and every download starts returning 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/build.sh "${{ matrix.php }}" out/

      # spc writes compiler output to its own log rather than stdout, so a
      # failed library build shows only "make exited 2" in the job log. Without
      # these a CI-only failure cannot be diagnosed at all.
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spc-logs-${{ matrix.php }}-${{ matrix.target.arch }}
          path: log/
          if-no-files-found: warn

      - name: Package
        run: scripts/package.sh "${{ matrix.php }}" out/ dist/

      - uses: actions/upload-artifact@v4
        with:
          name: lerd-php-${{ matrix.php }}-${{ matrix.target.arch }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
