name: Build and publish PHP binaries

# PHP patches land on a schedule nobody here controls, so the build follows the
# releases rather than someone remembering to tag. Each run asks php.net for the
# newest patch of every minor in versions.txt and builds only what is missing.
on:
  schedule:
    - cron: '0 6 * * 1'
  # The collector lives in the lerd repository and is only ever compiled here,
  # against the php-src tree a build leaves behind. Without this trigger a change
  # to it waits for php.net to publish a patch before it reaches a native
  # runtime, and until then the binaries carry a collector older than the lerd
  # writing the seams for it.
  repository_dispatch:
    types: [devtools-changed]
  workflow_dispatch:
    inputs:
      php:
        description: 'Single PHP minor to consider (blank considers all)'
        required: false
      arm_only:
        description: 'Build Apple silicon only (skip Intel)'
        type: boolean
        default: false
      skip_windows:
        description: 'Skip the Windows builds'
        type: boolean
        default: false
      force:
        description: 'Rebuild even if the patch is already published'
        type: boolean
        default: false
      lerd_ref:
        description: 'lerd branch to take the devtools collector from (blank uses its default branch)'
        required: false

permissions:
  contents: write

# Two runs publishing at once would race on the manifest commit.
concurrency:
  group: publish-php
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.pick.outputs.builds }}
      windows: ${{ steps.pick.outputs.windows }}
      releases: ${{ steps.pick.outputs.releases }}
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args="${{ github.repository }}"
          [ -n "${{ inputs.php }}" ] && args="$args --only ${{ inputs.php }}"
          [ "${{ inputs.force }}" = "true" ] && args="$args --force"
          [ "${{ inputs.skip_windows }}" = "true" ] && args="$args --skip-windows"
          # A collector change rebuilds what is already published, which the
          # planner would otherwise skip as present.
          [ "${{ github.event_name }}" = "repository_dispatch" ] && args="$args --force"
          plan="$(python3 scripts/plan.py $args)"
          echo "builds=$(jq -c .macos <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "windows=$(jq -c .windows <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "releases=$(jq -c .releases <<<"$plan")" >> "$GITHUB_OUTPUT"
          # Both architectures. macos-13 was retired on 2025-12-08; its
          # replacement macos-15-intel is the last x86_64 image and goes in
          # August 2027, at which point Intel builds need another home. macos-14
          # was retired on 2026-11-02.
          arm='{"arch":"arm64","runner":"macos-15"}'
          intel='{"arch":"x86_64","runner":"macos-15-intel"}'
          if [ "${{ inputs.arm_only }}" = "true" ]; then
            echo "targets=[$arm]" >> "$GITHUB_OUTPUT"
          else
            echo "targets=[$arm,$intel]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    strategy:
      fail-fast: false
      matrix:
        # One dimension per concern, each carrying everything it needs. An
        # include: entry whose keys match no existing combination is added as a
        # job of its own, so pairing values there breaks silently.
        build: ${{ fromJSON(needs.plan.outputs.builds) }}
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.target.runner }}
    # clang targets the runner's own macOS by default, so a macos-15 runner
    # would quietly stop the binaries from running on Sonoma.
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch static-php-cli
        # Newest stable release, resolved at build time. The version and digest
        # are recorded in BUILD-INFO.txt and ship inside the release tarball.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-spc.sh .

      # The libraries are most of the build and do not change between PHP
      # versions, so caching them turns fourteen minutes into about three. Keyed
      # by architecture: the tree is compiled objects, and restoring another
      # arch's would link the wrong ones.
      - name: Cache the library tree
        uses: actions/cache@v4
        with:
          path: |
            buildroot
            downloads
          key: spc-${{ matrix.target.arch }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('extensions.txt', 'shared-extensions.txt') }}

      # The query-capture collector lives in the lerd repository, beside the
      # image build that compiles it in. Checked out rather than vendored so
      # the two runtimes always ship the same collector.
      - name: Check out the devtools collector
        uses: actions/checkout@v4
        with:
          repository: lerd-env/lerd
          ref: ${{ inputs.lerd_ref || github.event.client_payload.lerd_ref }}
          path: .lerd
          sparse-checkout: internal/podman/devtools

      - name: Build
        env:
          LERD_DEVTOOLS_SRC: ${{ github.workspace }}/.lerd/internal/podman/devtools
          # spc resolves library versions through the GitHub API, which allows
          # sixty unauthenticated requests an hour. A runner exhausts that
          # immediately and every download starts returning 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/build.sh "${{ matrix.build.minor }}" out/ "${{ matrix.build.patch }}"

      # spc writes compiler output to its own log rather than stdout, so a
      # failed library build shows only "make exited 2" in the job log. Without
      # these a CI-only failure cannot be diagnosed at all.
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spc-logs-${{ matrix.build.patch }}-${{ matrix.target.arch }}
          path: log/
          if-no-files-found: warn

      - name: Package
        run: scripts/package.sh "${{ matrix.build.minor }}" out/ dist/ "${{ matrix.build.patch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.build.patch }}-${{ matrix.target.arch }}
          path: dist/*

  # Windows has no PHP-FPM and static-php-cli cannot load DLL extensions, so
  # nothing is compiled here but the collector: the official windows.php.net
  # build is repackaged with the PECL and Xdebug DLLs, and php-cgi serves in
  # place of FPM. See scripts/build-windows.py.
  build-windows:
    needs: plan
    if: needs.plan.outputs.windows != '[]'
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.plan.outputs.windows) }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # PHP refuses a module linked with a newer MSVC than its core, and 8.1 to
      # 8.3 cores were linked with VS 2019, so the collector needs that toolset
      # beside the image's VS 2022 one. build-windows.py picks it on its own.
      - name: Add the VS 2019 toolset
        if: contains(fromJSON('["8.1","8.2","8.3"]'), matrix.build.minor)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if (-not (Test-Path "$vs\VC\Tools\MSVC\14.29.*")) {
            $p = Start-Process -Wait -PassThru "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe" -ArgumentList `
              "modify", "--installPath", "`"$vs`"", "--add", "Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64", "--quiet", "--norestart", "--nocache"
            if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          }

      - name: Check out the devtools collector
        uses: actions/checkout@v4
        with:
          repository: lerd-env/lerd
          ref: ${{ inputs.lerd_ref || github.event.client_payload.lerd_ref }}
          path: .lerd
          sparse-checkout: internal/podman/devtools

      - name: Build
        env:
          LERD_DEVTOOLS_SRC: ${{ github.workspace }}/.lerd/internal/podman/devtools
        run: python scripts/build-windows.py "${{ matrix.build.minor }}" out "${{ matrix.build.patch }}"

      - name: Package
        run: python scripts/package-windows.py "${{ matrix.build.minor }}" out dist "${{ matrix.build.patch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.build.patch }}-windows
          path: dist/*

  # One release per patch, tagged for the PHP it carries, so a download URL says
  # exactly which build it points at and never changes underneath a pin. A
  # Windows build that fails, or that windows.php.net has not published yet,
  # leaves the release to macOS and is added to it by a later run; a macOS
  # failure still stops the release, as it always has.
  publish:
    needs: [plan, build, build-windows]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.releases != '[]' &&
      needs.build.result != 'failure' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build: ${{ fromJSON(needs.plan.outputs.releases) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-${{ matrix.build.patch }}-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.build.tag }}
          name: PHP ${{ matrix.build.patch }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  # The manifest is what lerd actually reads, and it names the current patch for
  # every minor. Regenerated from pins/ rather than from this run, so rebuilding
  # one minor does not drop the other four.
  manifest:
    needs: [plan, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Record the new pins
        run: |
          mkdir -p pins
          cp dist/pin-*.json pins/
          python3 scripts/manifest.py pins native-php.yaml
      - name: Commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pins native-php.yaml
          git diff --cached --quiet && { echo "manifest unchanged"; exit 0; }
          git commit -m "chore: pin $(cd dist && ls pin-*.json | wc -l | tr -d ' ') native php builds"
          git push
